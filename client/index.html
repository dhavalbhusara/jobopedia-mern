<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/jobopedia-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobopedia — National Govt &amp; Corporate Career Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <!-- Google AdSense Verification & Auto Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2309467781992974"
      crossorigin="anonymous"></script>

    <!-- Pre-load Stored Language into Google Translate Cookie before initialization -->
    <script>
      try {
        // Migration: Ensure default website language is English for all users
        if (localStorage.getItem('jobopedia_lang_default_v2') !== 'true') {
          localStorage.setItem('jobopedia_lang_default_v2', 'true');
          localStorage.setItem('jobopedia_language', 'en');
        }

        var savedLang = localStorage.getItem('jobopedia_language') || 'en';
        var hostname = window.location.hostname;

        if (savedLang && savedLang !== 'en') {
          document.cookie = "googtrans=/en/" + savedLang + "; path=/;";
          document.cookie = "googtrans=/auto/" + savedLang + "; path=/;";
          if (hostname && hostname !== 'localhost') {
            document.cookie = "googtrans=/en/" + savedLang + "; domain=." + hostname + "; path=/;";
            document.cookie = "googtrans=/auto/" + savedLang + "; domain=." + hostname + "; path=/;";
          }
        } else {
          // Default is English: explicitly remove translation cookies so website renders in clean English
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
          if (hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=." + hostname + ";";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + hostname + ";";
          }
        }
      } catch (e) {}
    </script>

    <!-- Google Translate Script & Initialization -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'gu,hi,en,mr,bn,ta,te,kn,pa,ur,ml,or,as',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body class="min-h-screen flex flex-col bg-slate-50 text-slate-900 antialiased">
    <!-- Hidden Google Translate Element -->
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
